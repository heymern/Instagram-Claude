<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;overflow:hidden}
.card{width:1080px;height:1350px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative;font-family:'FreeSerif','Liberation Serif',serif}
.dark{background:radial-gradient(ellipse at 50% 40%,#1d1a22 0%,#0b0a0d 70%);color:#f4f1ec}
.light{background:radial-gradient(ellipse at 50% 35%,#ffffff 0%,#f1ede8 75%);color:#16141a}
.frame{position:absolute;inset:48px;border:1.5px solid var(--line)}
.dark{--line:rgba(185,165,200,.45);--accent:#b9a5c8}
.light{--line:rgba(110,90,125,.35);--accent:#6e5a7d}
.logo{width:150px;height:150px;border-radius:50%;border:5px solid currentColor;display:flex;align-items:center;justify-content:center;font-size:104px;font-weight:700;margin-bottom:70px;line-height:1}
.kicker{font-family:'Liberation Sans',sans-serif;letter-spacing:.42em;font-size:30px;color:var(--accent);margin-bottom:36px}
h1{font-size:150px;font-weight:400;line-height:1.02;font-style:italic}
h2{font-size:92px;font-weight:700;margin-top:28px;letter-spacing:.01em}
.ko{font-family:'WenQuanYi Zen Hei',sans-serif;font-size:46px;margin-top:56px;color:var(--accent);letter-spacing:.08em}
.rule{width:120px;height:2px;background:var(--accent);margin:60px auto 40px}
.from{font-family:'Liberation Sans',sans-serif;font-size:30px;letter-spacing:.3em}
.handle{font-family:'Liberation Sans',sans-serif;font-size:28px;margin-top:18px;opacity:.7;letter-spacing:.06em}
</style></head><body><div class="card THEME">
<div class="frame"></div>
<div class="logo">N</div>
<div class="kicker">HAPPY BELATED</div>
<h1>Birthday,</h1>
<h2>Dr. Lee</h2>
<div class="ko">생일 축하드려요</div>
<div class="rule"></div>
<div class="from">FROM ALL OF US AT NUVEAU</div>
<div class="handle">@dr.lee_htx</div>
</div></body></html>
